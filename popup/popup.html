<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 420px; font: 13px/1.45 -apple-system, "Hiragino Sans", sans-serif;
    background: #17181c; color: #e8e8ea; padding: 10px;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  header h1 { font-size: 14px; font-weight: 700; letter-spacing: .3px; }
  header h1 span { color: #ff7a45; }
  .count { font-size: 11px; color: #9a9aa2; }
  .toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
  button {
    background: #2a2c33; border: 1px solid #3a3d46; color: #e8e8ea; border-radius: 6px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #34363f; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #ff7a45; border-color: #ff7a45; color: #17181c; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #ff8d5f; }
  button:focus-visible, a:focus-visible { outline: 2px solid #7cc4ff; outline-offset: 2px; }
  .access {
    margin-bottom: 8px; padding: 7px 8px; background: #1d1f24;
    border: 1px solid #2a2c33; border-radius: 7px;
  }
  .access-title { font-size: 11px; font-weight: 700; margin-bottom: 5px; }
  .access-actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .access-actions button { padding: 3px 7px; font-size: 10px; }
  #accessStatus { margin-top: 4px; min-height: 13px; font-size: 10px; color: #8b8b93; }
  #accessStatus.err { color: #ff6b6b; }
  #status { font-size: 11px; color: #9a9aa2; margin-bottom: 6px; min-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.err { color: #ff6b6b; white-space: normal; }
  #list { max-height: 390px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; background: #1f2127; border: 1px solid #2a2c33; border-radius: 8px; }
  .badge { flex: 0 0 auto; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: #333; color: #ccc; }
  .badge.video { background: #1d3a5f; color: #7cc4ff; }
  .badge.hls { background: #3a2f16; color: #ffb454; }
  .badge.hls-audio { background: #16333a; color: #7cd8e8; }
  .badge.audio { background: #1f3a2a; color: #6fe3a1; }
  .badge.dash { background: #3a1f3a; color: #e08fe0; }
  .info { flex: 1; min-width: 0; }
  .name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 10px; color: #8b8b93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #options { color: #9a9aa2; font-size: 15px; text-decoration: none; align-self: center; }
  #options:hover { color: #e8e8ea; }
  .item button { flex: 0 0 auto; padding: 4px 9px; font-size: 11px; }
  .item button.dl { background: #ff7a45; border-color: #ff7a45; color: #17181c; font-weight: 700; }
  .item button.busy { opacity: .5; cursor: default; }
  .empty { color: #77777f; font-size: 12px; text-align: center; padding: 24px 8px; }
  footer { margin-top: 8px; font-size: 10px; color: #5b5b63; display: flex; justify-content: space-between; }
  a { color: #7cc4ff; text-decoration: none; }
</style>
</head>
<body>
  <header>
    <h1>Media<span>Sniper</span></h1>
    <span class="count" id="count" aria-live="polite"></span>
  </header>
  <div class="toolbar" role="toolbar">
    <button id="rescan" data-i18n="rescan">Rescan</button>
    <button id="saveall" class="primary" data-i18n="saveAll">Save all</button>
    <button id="clear" data-i18n="clear">Clear</button>
    <button id="ytdlp" data-i18n="ytDlpCommand">yt-dlp command</button>
    <a id="options" href="#" data-i18n-title="settings" data-i18n-aria-label="settings">⚙</a>
  </div>
  <section class="access" aria-labelledby="accessTitle">
    <div class="access-title" id="accessTitle" data-i18n="accessTitle">Site access</div>
    <div class="access-actions">
      <button id="accessSite" data-i18n="accessSite">Always this site</button>
      <button id="accessAll" data-i18n="accessAll">Always all sites</button>
      <button id="accessClick" data-i18n="accessClick">Click only</button>
    </div>
    <div id="accessStatus" role="status" aria-live="polite"></div>
  </section>
  <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="list"></div>
  <footer>
    <span id="destHint" data-i18n="destRoot">Destination: ~/Downloads/</span>
    <span id="version" data-i18n-aria-label="version"></span>
  </footer>
  <script src="i18n.js"></script>
  <script src="site-access-ui.js"></script>
  <script src="../src/logic.js"></script>
  <script src="popup.js"></script>
  <script src="rescan-controller.js"></script>
  <script src="access-refresh.js"></script>
  <script src="meta.js"></script>
</body>
</html>
