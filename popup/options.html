<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Media Sniper 設定</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 14px/1.6 -apple-system, "Hiragino Sans", sans-serif;
    background: #17181c; color: #e8e8ea; padding: 24px;
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  h1 span { color: #ff7a45; }
  .sub { font-size: 12px; color: #9a9aa2; margin-bottom: 20px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 16px 0 4px; }
  .desc { font-size: 11px; color: #8b8b93; margin-bottom: 6px; }
  input[type="text"], input[type="number"], textarea {
    width: 100%; background: #1f2127; color: #e8e8ea;
    border: 1px solid #3a3d46; border-radius: 6px; padding: 8px 10px;
    font: inherit; font-size: 13px;
  }
  input:focus, textarea:focus { outline: none; border-color: #ff7a45; }
  textarea { height: 90px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; }
  button {
    background: #ff7a45; border: 1px solid #ff7a45; color: #17181c;
    border-radius: 6px; padding: 8px 22px; font-size: 13px; font-weight: 700;
    cursor: pointer; margin-top: 18px;
  }
  button:hover { background: #ff8d5f; }
  #status { font-size: 12px; color: #6fe3a1; margin-left: 12px; }
  #status.err { color: #ff6b6b; }
  code { background: #2a2c33; border-radius: 4px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
  <h1>Media<span>Sniper</span> 設定</h1>
  <div class="sub">設定はこのブラウザのプロファイルごとに保存されます</div>

  <label for="rootFolder">保存先フォルダ名</label>
  <div class="desc">Downloads の中に作るフォルダ。空欄なら Downloads 直下に保存。</div>
  <input type="text" id="rootFolder" placeholder="例: media-sniper">

  <label for="minSizeKb">最小サイズ (KB)</label>
  <div class="desc">これより小さい直接リンク media は広告・アイコン扱いで無視。(0で無効)</div>
  <input type="number" id="minSizeKb" min="0" step="50">

  <label for="blacklist">除外ドメイン</label>
  <div class="desc">ここに入れたドメインからの media は検出しない。<code>example.com</code> ならサブドメインも含む。改行かカンマで区切る。</div>
  <textarea id="blacklist" placeholder="ads.example.com&#10;tracker.io"></textarea>

  <div class="row">
    <button id="save">保存</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
