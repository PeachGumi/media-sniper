name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Manifest validation
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); const p=JSON.parse(fs.readFileSync('package.json','utf8')); if(m.version!==p.version) throw new Error('manifest/package version mismatch: '+m.version+' vs '+p.version); if(m.background.service_worker!=='src/background-entry.js') throw new Error('security entrypoint missing'); console.log('manifest OK', m.version)"

      - name: Package
        run: npm run zip

      - name: Verify packaged artifact
        run: |
          rm -rf /tmp/media-sniper-package
          mkdir -p /tmp/media-sniper-package
          unzip -q media-sniper.zip -d /tmp/media-sniper-package
          test -f /tmp/media-sniper-package/manifest.json
          test -f /tmp/media-sniper-package/LICENSE
          test -f /tmp/media-sniper-package/LICENSE.libav
          test -f /tmp/media-sniper-package/THIRD_PARTY_NOTICES.md
          test -f /tmp/media-sniper-package/src/background-entry.js
          test -f /tmp/media-sniper-package/src/security-bootstrap.js
          test -f /tmp/media-sniper-package/src/security-guard.js
          test -f /tmp/media-sniper-package/src/dash-inheritance.js
          test -f /tmp/media-sniper-package/src/background.js
          test -f /tmp/media-sniper-package/src/offscreen.js
          test -f /tmp/media-sniper-package/src/libav/libav-6.5.7.1-h264-aac-mp3.wasm.wasm
          test -f /tmp/media-sniper-package/popup/popup.html
          test -f /tmp/media-sniper-package/popup/meta.js
          echo "distribution zip:"
          sha256sum media-sniper.zip
          echo "vendored libav wasm:"
          sha256sum src/libav/libav-6.5.7.1-h264-aac-mp3.wasm.wasm

      - name: Privacy scan
        run: |
          # fail the build if new suspicious patterns creep in
          ! grep -rnE "eval\(|new Function\(|XMLHttpRequest\(" src/ popup/ --include="*.js" | grep -v "prototype" | grep -v "nativeFetch"
          ! grep -rniE "analytics|telemetry|track\.|google-analytics" src/ popup/ --include="*.js"
          echo "privacy scan clean"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E2E dependency
        run: python -m pip install --disable-pip-version-check websockets

      - name: Browser E2E
        run: npm run e2e
