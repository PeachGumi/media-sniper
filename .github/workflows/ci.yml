name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Manifest / version / permission validation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (m.version !== p.version) throw new Error('manifest/package version mismatch: ' + m.version + ' vs ' + p.version);
          if (m.background.service_worker !== 'src/background-entry.js') throw new Error('security entrypoint missing');
          if (m.default_locale !== 'en') throw new Error('default locale missing');
          const perms = new Set(m.permissions || []);
          for (const required of ['activeTab','downloads','offscreen','scripting','storage','webRequest']) {
            if (!perms.has(required)) throw new Error('required permission missing: ' + required);
          }
          if (perms.has('tabs')) throw new Error('broad tabs permission must not be required');
          if ((m.host_permissions || []).length) throw new Error('persistent host access must not be required at install time');
          if ((m.content_scripts || []).length) throw new Error('static all-site content scripts are forbidden; use site-access.js');
          const optional = [...(m.optional_host_permissions || [])].sort();
          const expected = ['http://*/*','https://*/*'].sort();
          if (JSON.stringify(optional) !== JSON.stringify(expected)) throw new Error('optional host scope must be HTTP(S)-only');
          const meta = fs.readFileSync('popup/meta.js', 'utf8');
          if (!/getManifest\(\)\.version/.test(meta)) throw new Error('UI version must come from manifest');
          const ref = process.env.GITHUB_REF || '';
          if (ref.startsWith('refs/tags/v')) {
            const tagVersion = ref.slice('refs/tags/v'.length);
            if (tagVersion !== m.version) throw new Error('tag/version mismatch: v' + tagVersion + ' vs ' + m.version);
          }
          console.log('manifest OK', m.version, 'least-privilege host model OK');
          NODE

      - name: Package
        run: npm run zip

      - name: Verify packaged artifact
        run: |
          rm -rf /tmp/media-sniper-package
          mkdir -p /tmp/media-sniper-package
          unzip -q media-sniper.zip -d /tmp/media-sniper-package
          test -f /tmp/media-sniper-package/manifest.json
          test -f /tmp/media-sniper-package/LICENSE
          test -f /tmp/media-sniper-package/LICENSE.libav
          test -f /tmp/media-sniper-package/THIRD_PARTY_NOTICES.md
          test -f /tmp/media-sniper-package/PRIVACY.md
          test -f /tmp/media-sniper-package/DISTRIBUTION.md
          test -f /tmp/media-sniper-package/docs/PERMISSIONS.md
          test -f /tmp/media-sniper-package/docs/MEMORY.md
          test -f /tmp/media-sniper-package/_locales/en/messages.json
          test -f /tmp/media-sniper-package/_locales/ja/messages.json
          test -f /tmp/media-sniper-package/src/background-entry.js
          test -f /tmp/media-sniper-package/src/background-lifecycle.js
          test -f /tmp/media-sniper-package/src/site-access.js
          test -f /tmp/media-sniper-package/src/install.js
          test -f /tmp/media-sniper-package/src/security-bootstrap.js
          test -f /tmp/media-sniper-package/src/security-guard.js
          test -f /tmp/media-sniper-package/src/dash-inheritance.js
          test -f /tmp/media-sniper-package/src/background.js
          test -f /tmp/media-sniper-package/src/offscreen.html
          test -f /tmp/media-sniper-package/src/offscreen-policy.js
          test -f /tmp/media-sniper-package/src/offscreen-streaming.js
          test -f /tmp/media-sniper-package/src/offscreen.js
          test -f /tmp/media-sniper-package/src/libav/libav-6.5.7.1-h264-aac-mp3.wasm.wasm
          test -f /tmp/media-sniper-package/popup/i18n.js
          test -f /tmp/media-sniper-package/popup/site-access-ui.js
          test -f /tmp/media-sniper-package/popup/access-refresh.js
          test -f /tmp/media-sniper-package/popup/popup.html
          test -f /tmp/media-sniper-package/popup/meta.js
          test -f /tmp/media-sniper-package/popup/onboarding.html
          test -f /tmp/media-sniper-package/popup/onboarding.js
          sha256sum media-sniper.zip | tee media-sniper.zip.sha256
          echo "vendored libav wasm:"
          sha256sum src/libav/libav-6.5.7.1-h264-aac-mp3.wasm.wasm

      - name: Privacy scan
        run: |
          ! grep -rnE "eval\(|new Function\(|XMLHttpRequest\(" src/ popup/ --include="*.js" | grep -v "prototype" | grep -v "nativeFetch"
          ! grep -rniE "analytics|telemetry|track\.|google-analytics" src/ popup/ --include="*.js"
          echo "privacy scan clean"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exact distribution artifact
        run: |
          npm run zip
          rm -rf /tmp/media-sniper-e2e
          mkdir -p /tmp/media-sniper-e2e
          unzip -q media-sniper.zip -d /tmp/media-sniper-e2e
          test -f /tmp/media-sniper-e2e/manifest.json
          test -f /tmp/media-sniper-e2e/src/site-access.js
          test -f /tmp/media-sniper-e2e/src/offscreen-streaming.js
          echo "MEDIA_SNIPER_EXTENSION_ROOT=/tmp/media-sniper-e2e" >> "$GITHUB_ENV"

      - name: Install Chrome for Testing
        env:
          CFT_VERSION: '151.0.7922.77'
        run: |
          set -euxo pipefail
          root=/tmp/chrome-for-testing
          rm -rf "$root"
          mkdir -p "$root"
          url="https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
          curl --fail --location --retry 3 --output /tmp/chrome-for-testing.zip "$url"
          unzip -q /tmp/chrome-for-testing.zip -d "$root"
          browser="$root/chrome-linux64/chrome"
          test -x "$browser"
          "$browser" --version
          wrapper="$root/chrome-ci"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$browser" > "$wrapper"
          chmod +x "$wrapper"
          echo "MEDIA_SNIPER_BRAVE=$wrapper" >> "$GITHUB_ENV"

      - name: Install E2E dependency
        run: python -m pip install --disable-pip-version-check websockets

      - name: Browser E2E against packaged zip
        run: npm run e2e

  artifact:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild verified artifact and checksum
        run: |
          npm run zip
          sha256sum media-sniper.zip > media-sniper.zip.sha256
          cat media-sniper.zip.sha256
      - name: Upload verified CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-sniper-${{ github.sha }}
          path: |
            media-sniper.zip
            media-sniper.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Enforce release-approval gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -f docs/RELEASE_APPROVED
          grep -qx 'approved' docs/RELEASE_APPROVED
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" media-sniper.zip media-sniper.zip.sha256 \
            --verify-tag --generate-notes --title "Media Sniper $GITHUB_REF_NAME"
